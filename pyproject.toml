[project]
name = "arl"
version = "0.1.0"
description = "An open-source tool that traces, tests, attacks and benchmarks AI agents, plus PulseAgent-lite, a small coding agent that ARL tests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "openai>=3.57.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
]

[project.optional-dependencies]
local = [
    "mlx-lm>=0.32.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
